apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: facele-base

resources:
  - namespace/namespace.yaml
  - secrets/postgres-secret.yaml
  - configmaps/configmap-facele.yaml
  - configmaps/configmap-ws-commands.yaml
  - configmaps/runtime-configmap.yaml
  - database/postgres-init-scripts.yaml
  - database/postgres-deployment.yaml
  - services/ws-deployment.yaml
  - services/qp-deployment.yaml
  - services/qw-deployment.yaml

commonLabels:
  app.kubernetes.io/name: facele
  app.kubernetes.io/version: "20250924"

namespace: facele

images:
  - name: facele-ws
    newTag: latest
  - name: facele-qp
    newTag: latest
  - name: facele-qw
    newTag: latest