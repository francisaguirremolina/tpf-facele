    FUNCTION facele.spc_deltmptab_facele_tpf_facele() OWNER TO sa;\n\n--\n-- Name:
    spc_initschseq_facele_tpf_facele(); Type: FUNCTION; Schema: facele; Owner: sa\n--\n\nCREATE
    FUNCTION facele.spc_initschseq_facele_tpf_facele() RETURNS void\n    LANGUAGE
    plpgsql\n    AS $$\nDECLARE\n\tl_min\tint8;\n\tl_max\tint8;\n\tl_inc\tint8;\n\tl_mod\tint8;\n\nBEGIN\n\tl_min\t:=
    0;\n\tl_max\t:= 1000000000;\n\tl_inc\t:= 1;\n\tl_mod\t:= 0;\n\t\n\tIF EXISTS (SELECT
    true FROM information_schema.tables \n\t\tWHERE table_schema = 'sync' AND table_name
    = 't_masterservers' ) THEN\n\n\t\t-- Esquema de replicación implementado\n\n\t\tSELECT
    MinSequenceValue, MaxSequenceValue, IncSequenceValue, ModSequenceValue\n\t\t\tINTO
    l_min, l_max, l_inc, l_mod\n\t\t\tFROM sync.t_masterservers \n\t\t\tWHERE ActiveServer
    = 1;\n\n        IF NOT FOUND THEN\n        \n            l_min\t:= 0;\n\t       l_max\t:=
    1000000000;\n\t       l_inc\t:= 1;\n\t       l_mod\t:= 0;\n\t\n        END IF;\n
    \       \n\tEND IF;\n\n\t\n    PERFORM spc_InitSequence('facele.t_FEXPermisos',
    'IdFEXPermiso', 'facele.sq_FEXPermisos_IdFEXPermiso', l_min, l_max, l_inc, l_mod);\t\n
    \   PERFORM spc_InitSequence('facele.t_IPCColas', 'IdIPCCola', 'facele.sq_IPCColas_IdIPCCola',
    l_min, l_max, l_inc, l_mod);\t\n    PERFORM spc_InitSequence('facele.t_FECotizMonedas',
    'IdCotizMoneda', 'facele.sq_FECotizMonedas_IdCotizMoneda', l_min, l_max, l_inc,
    l_mod);\t\n    PERFORM spc_InitSequence('facele.t_ModeloCopias', 'IdCopia', 'facele.sq_ModeloCopias_IdCopia',
    l_min, l_max, l_inc, l_mod);\t\n    PERFORM spc_InitSequence('facele.t_FEPtosVta',
    'IdPtoVta', 'facele.sq_FEPtosVta_IdPtoVta', l_min, l_max, l_inc, l_mod);\t\n    PERFORM
    spc_InitSequence('facele.t_FEComprobantesAsoc', 'IdComprobAsoc', 'facele.sq_FEComprobantesAsoc_IdComprobAsoc',
    l_min, l_max, l_inc, l_mod);\t\n    PERFORM spc_InitSequence('facele.t_FEComprobantesDet',
    'IdComprobanteDet', 'facele.sq_FEComprobantesDet_IdComprobanteDet', l_min, l_max,
    l_inc, l_mod);\t\n    PERFORM spc_InitSequence('facele.t_FEComprobantesIva', 'IdComprobIVA',
    'facele.sq_FEComprobantesIva_IdComprobIVA', l_min, l_max, l_inc, l_mod);\t\n    PERFORM
    spc_InitSequence('facele.t_FEComprobantesOpc', 'IdComprobOpc', 'facele.sq_FEComprobantesOpc_IdComprobOpc',
    l_min, l_max, l_inc, l_mod);\t\n    PERFORM spc_InitSequence('facele.t_FEComprobantesTrib',
    'IdComprobTrib', 'facele.sq_FEComprobantesTrib_IdComprobTrib', l_min, l_max, l_inc,
    l_mod);\nEND    \n$$;\n\n\nALTER FUNCTION facele.spc_initschseq_facele_tpf_facele()
