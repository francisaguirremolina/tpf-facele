    fecom\n     JOIN facele.t_feptosvta pv USING (idptovta));\n\n\nALTER VIEW public.foo
    OWNER TO sa;\n\n--\n-- Name: pg_table_usage; Type: VIEW; Schema: public; Owner:
    sa\n--\n\nCREATE VIEW public.pg_table_usage AS\n SELECT ctu.table_schema,\n    ctu.table_name,\n
    \   'table'::character varying(5) AS obj_type,\n    tc.table_schema AS obj_schema,\n
    \   tc.table_name AS obj_name\n   FROM (information_schema.constraint_table_usage
    ctu\n     JOIN information_schema.table_constraints tc USING (constraint_schema,
    constraint_name))\n  WHERE (((tc.constraint_type)::text = 'FOREIGN KEY'::text)
    AND ((ctu.table_schema)::text <> ALL (ARRAY[('information_schema'::character varying)::text,
    ('pg_catalog'::character varying)::text, ('pg_toast'::character varying)::text,
    ('plsh_test'::character varying)::text, ('sqlj'::character varying)::text])) AND
    ((tc.table_schema)::text <> ALL (ARRAY[('information_schema'::character varying)::text,
    ('pg_catalog'::character varying)::text, ('pg_toast'::character varying)::text,
    ('plsh_test'::character varying)::text, ('sqlj'::character varying)::text])));\n\n\nALTER
    VIEW public.pg_table_usage OWNER TO sa;\n\n--\n-- Name: pg_view_usage; Type: VIEW;
    Schema: public; Owner: sa\n--\n\nCREATE VIEW public.pg_view_usage AS\n SELECT
    vtu.view_schema,\n    vtu.view_name,\n        CASE t.table_type\n            WHEN
    'VIEW'::text THEN 'view'::character varying\n            WHEN 'BASE TABLE'::text
    THEN 'table'::character varying\n            ELSE (t.table_type)::character varying\n
    \       END AS obj_type,\n    vtu.table_schema AS obj_schema,\n    vtu.table_name
    AS obj_name\n   FROM (information_schema.view_table_usage vtu\n     JOIN information_schema.tables
    t USING (table_schema, table_name))\n  WHERE (((vtu.view_schema)::text <> ALL
    (ARRAY[('information_schema'::character varying)::text, ('pg_catalog'::character
    varying)::text, ('pg_toast'::character varying)::text, ('plsh_test'::character
    varying)::text, ('sqlj'::character varying)::text])) AND ((vtu.table_schema)::text
    <> ALL (ARRAY[('information_schema'::character varying)::text, ('pg_catalog'::character
    varying)::text, ('pg_toast'::character varying)::text, ('plsh_test'::character
    varying)::text, ('sqlj'::character varying)::text])))\nUNION\n SELECT vru.table_schema
    AS view_schema,\n    vru.table_name AS view_name,\n    'function'::character varying
    AS obj_type,\n    r.routine_schema AS obj_schema,\n    r.routine_name AS obj_name\n
    \  FROM (information_schema.view_routine_usage vru\n     JOIN information_schema.routines
    r USING (specific_schema, specific_name))\n  WHERE ((vru.table_schema)::text <>
    ALL (ARRAY[('information_schema'::character varying)::text, ('pg_catalog'::character
    varying)::text, ('pg_toast'::character varying)::text, ('plsh_test'::character
    varying)::text, ('sqlj'::character varying)::text]));\n\n\nALTER VIEW public.pg_view_usage
    OWNER TO sa;\n\n--\n-- Name: pg_object_usage; Type: VIEW; Schema: public; Owner:
    sa\n--\n\nCREATE VIEW public.pg_object_usage AS\n SELECT 'table'::character varying
    AS parent_type,\n    tu.table_schema AS parent_schema,\n    tu.table_name AS parent_name,\n
    \   tu.obj_type,\n    tu.obj_schema,\n    tu.obj_name\n   FROM public.pg_table_usage
    tu\nUNION\n SELECT vu.obj_type AS parent_type,\n    vu.obj_schema AS parent_schema,\n
    \   vu.obj_name AS parent_name,\n    'view'::character varying AS obj_type,\n
    \   vu.view_schema AS obj_schema,\n    vu.view_name AS obj_name\n   FROM public.pg_view_usage
    vu;\n\n\nALTER VIEW public.pg_object_usage OWNER TO sa;\n\n--\n-- Name: pg_userfunctions;
    Type: VIEW; Schema: public; Owner: sa\n--\n\nCREATE VIEW public.pg_userfunctions
    AS\n SELECT (((n.nspname)::text || '.'::text) || (p.proname)::text) AS fullname,\n
    \   oidvectortypes(p.proargtypes) AS arguments,\n    (((((quote_ident((n.nspname)::text)
    || '.'::text) || quote_ident((p.proname)::text)) || '('::text) || oidvectortypes(p.proargtypes))
    || ')'::text) AS declaration\n   FROM (pg_proc p\n     LEFT JOIN pg_namespace
    n ON ((n.oid = p.pronamespace)))\n  WHERE ((p.prorettype <> ('cstring'::regtype)::oid)
    AND ((p.proargtypes[0] IS NULL) OR (p.proargtypes[0] <> ('cstring'::regtype)::oid))
    AND (n.nspname <> ALL (ARRAY['pg_catalog'::name, 'information_schema'::name, 'sqlj'::name])));\n\n\nALTER
    VIEW public.pg_userfunctions OWNER TO sa;\n\n--\n-- Name: pg_overloadeduserfunctions;
