    (\n                 p_rec.Concepto, \n                 p_rec.Descripcion, \n                 p_rec.FchDesde,
    \n                 p_rec.FchHasta\n    );\nEND;\n$$;\n\n\nALTER FUNCTION facele.spar_conceptos(p_rec
