    facele; Owner: sa\n--\n\nCREATE FUNCTION facele.spd_conceptos(p_concepto facele.concepto)
    RETURNS void\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n\tl_errorMsg\tTEXT;\n
    \   l_dmlString         TEXT;\n         l_pkString      TEXT;\n\n\tl_Concepto\tfacele.Concepto;\n\nBEGIN\n\tl_Concepto
    := p_Concepto;\n\t\n\n    l_dmlString := 'DELETE FROM facele.t_Conceptos WHERE
