apiVersion: v1
data:
  init.sh: "set -e\n\necho \"Ejecutando script de inicialización de la base de datos...\"\n\nPOSTGRES_USER=${POSTGRES_USER:-sa}\nPOSTGRES_DB=${POSTGRES_DB:-facele_tpf}\necho
    \"Usando usuario: $POSTGRES_USER\"\necho \"Usando base de datos: $POSTGRES_DB\"\n\necho
    \"Esperando a que PostgreSQL esté listo...\"\nfor i in {1..30}; do\n    if pg_isready
    -U $POSTGRES_USER -d $POSTGRES_DB; then\n        echo \"✅ PostgreSQL está listo!\"\n
    \       break\n    fi\n    echo \"Intento $i/30 - Esperando...\"\n    sleep 2\ndone\n\nsleep
    3\n\nif ! psql -U $POSTGRES_USER -d $POSTGRES_DB -c \"SELECT 1;\" > /dev/null
    2>&1; then\n    echo \"❌ ERROR: No se pudo conectar a PostgreSQL después de 30
    intentos\"\n    exit 1\nfi\n\nif [ -f /docker-entrypoint-initdb.d/postsql.dump
    ]; then\n    echo \"\U0001F4E6 Cargando dump SQL...\"\n    psql -v ON_ERROR_STOP=1
    -U $POSTGRES_USER -d $POSTGRES_DB -f /docker-entrypoint-initdb.d/postsql.dump\n
    \   echo \"✅ Dump cargado exitosamente!\"\nelse\n    echo \"❌ ERROR: Archivo dump
    no encontrado: /docker-entrypoint-initdb.d/postsql.dump\"\n    exit 1\nfi\n\necho
    \"Inicialización completada exitosamente.\""
  postsql.dump: "--\n-- PostgreSQL database dump\n--\n\n-- Dumped from database version
    16.9\n-- Dumped by pg_dump version 16.9\n\nSET statement_timeout = 0;\nSET lock_timeout
    = 0;\nSET idle_in_transaction_session_timeout = 0;\nSET client_encoding = 'UTF8';\nSET
    standard_conforming_strings = on;\nSELECT pg_catalog.set_config('search_path',
    '', false);\nSET check_function_bodies = false;\nSET xmloption = content;\nSET
    client_min_messages = warning;\nSET row_security = off;\n\n--\n-- Name: facele;
    Type: SCHEMA; Schema: -; Owner: sa\n--\n\nCREATE SCHEMA facele;\n\n\nALTER SCHEMA
    facele OWNER TO sa;\n\n--\n-- Name: barcode42; Type: DOMAIN; Schema: facele; Owner:
    sa\n--\n\nCREATE DOMAIN facele.barcode42 AS character varying(42);\n\n\nALTER
    DOMAIN facele.barcode42 OWNER TO sa;\n\n--\n-- Name: DOMAIN barcode42; Type: COMMENT;
    Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.barcode42 IS 'Código
    de barras al pie de un comprobante autorizado. \nDe acuerdo con la R.G. 1702 (2004).
    Contiene 42 dígitos:\n- C.U.I.T. (Clave Unica de Identificación Tributaria) del
    emisor (11 caracteres).\n- Código de tipo de comprobante (3 caracteres).\n- Punto
    de venta (5 caracteres).\n- Código de Autorización de Impresión (14 caracteres).\n-
    Fecha de vencimiento (8 caracteres).\n- Dígito verificador (1 carácter).';\n\n\n--\n--
    Name: bonificacion4d; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.bonificacion4d AS numeric(8,4);\n\n\nALTER DOMAIN facele.bonificacion4d
    OWNER TO sa;\n\n--\n-- Name: cbtefam; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE
    DOMAIN facele.cbtefam AS character varying(10);\n\n\nALTER DOMAIN facele.cbtefam
    OWNER TO sa;\n\n--\n-- Name: DOMAIN cbtefam; Type: COMMENT; Schema: facele; Owner:
    sa\n--\n\nCOMMENT ON DOMAIN facele.cbtefam IS 'Familia de comprobante (FAC, ND,
    NC, CVLP, FCEM, etc.)';\n\n\n--\n-- Name: cbtenumero; Type: DOMAIN; Schema: facele;
    Owner: sa\n--\n\nCREATE DOMAIN facele.cbtenumero AS integer;\n\n\nALTER DOMAIN
    facele.cbtenumero OWNER TO sa;\n\n--\n-- Name: DOMAIN cbtenumero; Type: COMMENT;
    Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.cbtenumero IS 'Número
    de comprobante. Hasta 8 dígitos';\n\n\n--\n-- Name: cbtetipo; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.cbtetipo AS integer;\n\n\nALTER
    DOMAIN facele.cbtetipo OWNER TO sa;\n\n--\n-- Name: DOMAIN cbtetipo; Type: COMMENT;
    Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.cbtetipo IS 'Tipo de
    comprobante. Hasta 3 dígitos';\n\n\n--\n-- Name: cbu; Type: DOMAIN; Schema: facele;
    Owner: sa\n--\n\nCREATE DOMAIN facele.cbu AS character varying(22);\n\n\nALTER
    DOMAIN facele.cbu OWNER TO sa;\n\n--\n-- Name: DOMAIN cbu; Type: COMMENT; Schema:
    facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.cbu IS 'Clave Bancaria Uniforme.
    22 dígitos.';\n\n\n--\n-- Name: certificado; Type: DOMAIN; Schema: facele; Owner:
    sa\n--\n\nCREATE DOMAIN facele.certificado AS character varying(2000);\n\n\nALTER
    DOMAIN facele.certificado OWNER TO sa;\n\n--\n-- Name: DOMAIN certificado; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.certificado
    IS 'Certificado X.509 en formato PEM';\n\n\n--\n-- Name: claveprivada; Type: DOMAIN;
    Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.claveprivada AS character
    varying(2000);\n\n\nALTER DOMAIN facele.claveprivada OWNER TO sa;\n\n--\n-- Name:
    DOMAIN claveprivada; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON
    DOMAIN facele.claveprivada IS 'PKCS#8 en formato PEM';\n\n\n--\n-- Name: cmpclase;
    Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.cmpclase AS
    character varying(10);\n\n\nALTER DOMAIN facele.cmpclase OWNER TO sa;\n\n--\n--
    Name: DOMAIN cmpclase; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.cmpclase IS 'Clase de comprobante (\"A/M/C\", \"B/C\", etc.)';\n\n\n--\n--
    Name: codactividad; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.codactividad AS numeric(12,0);\n\n\nALTER DOMAIN facele.codactividad OWNER
    TO sa;\n\n--\n-- Name: DOMAIN codactividad; Type: COMMENT; Schema: facele; Owner:
    sa\n--\n\nCOMMENT ON DOMAIN facele.codactividad IS 'Código de actividad del contribuyente.
    Se pueden consultar invocando el WS \"FEParamGetActividades\"';\n\n\n--\n-- Name:
    codaliciva; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.codaliciva
    AS integer;\n\n\nALTER DOMAIN facele.codaliciva OWNER TO sa;\n\n--\n-- Name: DOMAIN
    codaliciva; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN
    facele.codaliciva IS 'Código de alícuota de IVA (según el método FEParamGetTiposIva)';\n\n\n--\n--
    Name: codautorizacion; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.codautorizacion AS character varying(14);\n\n\nALTER DOMAIN facele.codautorizacion
    OWNER TO sa;\n\n--\n-- Name: DOMAIN codautorizacion; Type: COMMENT; Schema: facele;
    Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.codautorizacion IS 'Código de autorización
    otorgado por AFIP (CAE)';\n\n\n--\n-- Name: codcondiva; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.codcondiva AS integer;\n\n\nALTER
    DOMAIN facele.codcondiva OWNER TO sa;\n\n--\n-- Name: DOMAIN codcondiva; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.codcondiva
    IS 'Código de condición de IVA del receptor';\n\n\n--\n-- Name: coddespacho; Type:
    DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.coddespacho AS character
    varying(16);\n\n\nALTER DOMAIN facele.coddespacho OWNER TO sa;\n\n--\n-- Name:
    DOMAIN coddespacho; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON
    DOMAIN facele.coddespacho IS 'Código de despacho o permiso de embarque';\n\n\n--\n--
    Name: codigoproducto; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.codigoproducto AS character varying(20);\n\n\nALTER DOMAIN facele.codigoproducto
    OWNER TO sa;\n\n--\n-- Name: DOMAIN codigoproducto; Type: COMMENT; Schema: facele;
    Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.codigoproducto IS 'Código del producto,
    según el fabricante, el proveedor o la empresa.';\n\n\n--\n-- Name: codopcional;
    Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.codopcional
    AS character varying(4);\n\n\nALTER DOMAIN facele.codopcional OWNER TO sa;\n\n--\n--
    Name: DOMAIN codopcional; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.codopcional IS 'Código de concepto opcional informado (según
    el método FEParamGetTiposOpcional)';\n\n\n--\n-- Name: codtributo; Type: DOMAIN;
    Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.codtributo AS integer;\n\n\nALTER
    DOMAIN facele.codtributo OWNER TO sa;\n\n--\n-- Name: DOMAIN codtributo; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.codtributo
    IS 'Código de tributo (según el método FEParamGetTiposTributos)';\n\n\n--\n--
    Name: concepto; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.concepto
    AS integer;\n\n\nALTER DOMAIN facele.concepto OWNER TO sa;\n\n--\n-- Name: DOMAIN
    concepto; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.concepto
    IS 'Concepto del Comprobante. \nValores permitidos: \n1=Productos \n2=Servicios
    \n3=Productos y Servicios';\n\n\n--\n-- Name: cuit; Type: DOMAIN; Schema: facele;
    Owner: sa\n--\n\nCREATE DOMAIN facele.cuit AS numeric(11,0);\n\n\nALTER DOMAIN
    facele.cuit OWNER TO sa;\n\n--\n-- Name: DOMAIN cuit; Type: COMMENT; Schema: facele;
    Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.cuit IS 'Código Único de Identificación
    Tributaria; 11 dígitos sin espacios ni guiones';\n\n\n--\n-- Name: descripcion;
    Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.descripcion
    AS character varying(100);\n\n\nALTER DOMAIN facele.descripcion OWNER TO sa;\n\n--\n--
    Name: DOMAIN descripcion; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.descripcion IS 'Descripción';\n\n\n--\n-- Name: descripcion250;
    Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.descripcion250
    AS character varying(250);\n\n\nALTER DOMAIN facele.descripcion250 OWNER TO sa;\n\n--\n--
    Name: DOMAIN descripcion250; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.descripcion250 IS 'Descripción';\n\n\n--\n-- Name: docnro; Type:
    DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.docnro AS numeric(11,0);\n\n\nALTER
    DOMAIN facele.docnro OWNER TO sa;\n\n--\n-- Name: DOMAIN docnro; Type: COMMENT;
    Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.docnro IS 'Nro. de identificación
    del comprador';\n\n\n--\n-- Name: doctipo; Type: DOMAIN; Schema: facele; Owner:
    sa\n--\n\nCREATE DOMAIN facele.doctipo AS integer;\n\n\nALTER DOMAIN facele.doctipo
    OWNER TO sa;\n\n--\n-- Name: DOMAIN doctipo; Type: COMMENT; Schema: facele; Owner:
    sa\n--\n\nCOMMENT ON DOMAIN facele.doctipo IS 'Código de documento identificatorio
    del comprador';\n\n\n--\n-- Name: estadopdf; Type: DOMAIN; Schema: facele; Owner:
    sa\n--\n\nCREATE DOMAIN facele.estadopdf AS character(1);\n\n\nALTER DOMAIN facele.estadopdf
    OWNER TO sa;\n\n--\n-- Name: DOMAIN estadopdf; Type: COMMENT; Schema: facele;
    Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.estadopdf IS 'Estado de la generación
    del PDF:\n- \"P\": pendiente\n- \"G\": generado\n- \"S\": suspendido\n- \"E\":
    error';\n\n\n--\n-- Name: fecha; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE
    DOMAIN facele.fecha AS date;\n\n\nALTER DOMAIN facele.fecha OWNER TO sa;\n\n--\n--
    Name: DOMAIN fecha; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON
    DOMAIN facele.fecha IS 'Fecha';\n\n\n--\n-- Name: fechahora; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.fechahora AS timestamp without time
    zone;\n\n\nALTER DOMAIN facele.fechahora OWNER TO sa;\n\n--\n-- Name: DOMAIN fechahora;
    Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.fechahora
    IS 'Fecha y hora';\n\n\n--\n-- Name: fullfilename; Type: DOMAIN; Schema: facele;
    Owner: sa\n--\n\nCREATE DOMAIN facele.fullfilename AS character varying(200);\n\n\nALTER
    DOMAIN facele.fullfilename OWNER TO sa;\n\n--\n-- Name: DOMAIN fullfilename; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.fullfilename
    IS 'Nombre completo de archivo';\n\n\n--\n-- Name: hashlink; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.hashlink AS character varying(20);\n\n\nALTER
    DOMAIN facele.hashlink OWNER TO sa;\n\n--\n-- Name: DOMAIN hashlink; Type: COMMENT;
    Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.hashlink IS 'Código
    pseudo-aleatorio para la identificación segura de comprobantes generados. \nSólo
    letras \"A\" a \"Z\" y dígitos \"0\" a \"9\". 20 caracteres.';\n\n\n--\n-- Name:
    idcomprobantedet; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.idcomprobantedet AS integer;\n\n\nALTER DOMAIN facele.idcomprobantedet
    OWNER TO sa;\n\n--\n-- Name: DOMAIN idcomprobantedet; Type: COMMENT; Schema: facele;
    Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idcomprobantedet IS 'Código de detalle
    de comprobante';\n\n\n--\n-- Name: idcomprobasoc; Type: DOMAIN; Schema: facele;
    Owner: sa\n--\n\nCREATE DOMAIN facele.idcomprobasoc AS integer;\n\n\nALTER DOMAIN
    facele.idcomprobasoc OWNER TO sa;\n\n--\n-- Name: DOMAIN idcomprobasoc; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idcomprobasoc
    IS 'Código interno de asociación de un comprobante asociado a un comprobante electrónico';\n\n\n--\n--
    Name: idcomprobiva; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.idcomprobiva AS integer;\n\n\nALTER DOMAIN facele.idcomprobiva OWNER TO
    sa;\n\n--\n-- Name: DOMAIN idcomprobiva; Type: COMMENT; Schema: facele; Owner:
    sa\n--\n\nCOMMENT ON DOMAIN facele.idcomprobiva IS 'Código interno de declaración
    de IVA de un comprobante electrónico';\n\n\n--\n-- Name: idcomprobopc; Type: DOMAIN;
    Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idcomprobopc AS integer;\n\n\nALTER
    DOMAIN facele.idcomprobopc OWNER TO sa;\n\n--\n-- Name: DOMAIN idcomprobopc; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idcomprobopc
    IS 'Código interno de concepto opcional';\n\n\n--\n-- Name: idcomprobtrib; Type:
    DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idcomprobtrib AS
    integer;\n\n\nALTER DOMAIN facele.idcomprobtrib OWNER TO sa;\n\n--\n-- Name: DOMAIN
    idcomprobtrib; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN
    facele.idcomprobtrib IS 'Código interno de tributo de un comprobante electrónico';\n\n\n--\n--
    Name: idcopia; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idcopia
    AS integer;\n\n\nALTER DOMAIN facele.idcopia OWNER TO sa;\n\n--\n-- Name: DOMAIN
    idcopia; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idcopia
    IS 'Código de copia de documento electrónico';\n\n\n--\n-- Name: idcotizmoneda;
    Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idcotizmoneda
    AS integer;\n\n\nALTER DOMAIN facele.idcotizmoneda OWNER TO sa;\n\n--\n-- Name:
    DOMAIN idcotizmoneda; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.idcotizmoneda IS 'Código de cotización de moneda';\n\n\n--\n--
    Name: iddocumentofe; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.iddocumentofe AS integer;\n\n\nALTER DOMAIN facele.iddocumentofe OWNER
    TO sa;\n\n--\n-- Name: DOMAIN iddocumentofe; Type: COMMENT; Schema: facele; Owner:
    sa\n--\n\nCOMMENT ON DOMAIN facele.iddocumentofe IS 'Código interno de comprobante';\n\n\n--\n--
    Name: identidad; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.identidad AS integer;\n\n\nALTER DOMAIN facele.identidad OWNER TO sa;\n\n--\n--
    Name: DOMAIN identidad; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.identidad IS 'Código genérico de alguna entidad de otro modelo
    de datos';\n\n\n--\n-- Name: idfexdstcuit; Type: DOMAIN; Schema: facele; Owner:
    sa\n--\n\nCREATE DOMAIN facele.idfexdstcuit AS numeric(11,0);\n\n\nALTER DOMAIN
    facele.idfexdstcuit OWNER TO sa;\n\n--\n-- Name: DOMAIN idfexdstcuit; Type: COMMENT;
    Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idfexdstcuit IS 'Código
    de CUIT de destino';\n\n\n--\n-- Name: idfexdstpais; Type: DOMAIN; Schema: facele;
    Owner: sa\n--\n\nCREATE DOMAIN facele.idfexdstpais AS character varying(3);\n\n\nALTER
    DOMAIN facele.idfexdstpais OWNER TO sa;\n\n--\n-- Name: DOMAIN idfexdstpais; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idfexdstpais
    IS 'Código de país de destino';\n\n\n--\n-- Name: idfexidioma; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idfexidioma AS integer;\n\n\nALTER
    DOMAIN facele.idfexidioma OWNER TO sa;\n\n--\n-- Name: DOMAIN idfexidioma; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idfexidioma
    IS 'Código de idioma';\n\n\n--\n-- Name: idfexincoterm; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idfexincoterm AS character varying(3);\n\n\nALTER
    DOMAIN facele.idfexincoterm OWNER TO sa;\n\n--\n-- Name: DOMAIN idfexincoterm;
    Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idfexincoterm
    IS 'Código de incoterm';\n\n\n--\n-- Name: idfexpermiso; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idfexpermiso AS integer;\n\n\nALTER
    DOMAIN facele.idfexpermiso OWNER TO sa;\n\n--\n-- Name: DOMAIN idfexpermiso; Type:
    COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idfexpermiso
    IS 'Código de permiso';\n\n\n--\n-- Name: idfextipoexpo; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idfextipoexpo AS integer;\n\n\nALTER
    DOMAIN facele.idfextipoexpo OWNER TO sa;\n\n--\n-- Name: DOMAIN idfextipoexpo;
    Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idfextipoexpo
    IS 'Código de tipo de exportación';\n\n\n--\n-- Name: idfexunidadmedida; Type:
    DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idfexunidadmedida
    AS integer;\n\n\nALTER DOMAIN facele.idfexunidadmedida OWNER TO sa;\n\n--\n--
    Name: DOMAIN idfexunidadmedida; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.idfexunidadmedida IS 'Código de unidad de medida';\n\n\n--\n--
    Name: idipccola; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN
    facele.idipccola AS integer;\n\n\nALTER DOMAIN facele.idipccola OWNER TO sa;\n\n--\n--
    Name: DOMAIN idipccola; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.idipccola IS 'Código de IPCCola';\n\n\n--\n-- Name: idlotefacturacion;
    Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idlotefacturacion
    AS integer;\n\n\nALTER DOMAIN facele.idlotefacturacion OWNER TO sa;\n\n--\n--
    Name: DOMAIN idlotefacturacion; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON DOMAIN facele.idlotefacturacion IS 'Código de lote de facturación que agrupa
    varios comprobantes a facturar';\n\n\n--\n-- Name: idpais; Type: DOMAIN; Schema:
    facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idpais AS integer;\n\n\nALTER DOMAIN
    facele.idpais OWNER TO sa;\n\n--\n-- Name: DOMAIN idpais; Type: COMMENT; Schema:
    facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idpais IS 'Código de país';\n\n\n--\n--
    Name: idptovta; Type: DOMAIN; Schema: facele; Owner: sa\n--\n\nCREATE DOMAIN facele.idptovta
    AS integer;\n\n\nALTER DOMAIN facele.idptovta OWNER TO sa;\n\n--\n-- Name: DOMAIN
    idptovta; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT ON DOMAIN facele.idptovta
    IS 'Código interno vde un punto de venta declarado';\n\n\n--\n-- Name: letrafiscal;
