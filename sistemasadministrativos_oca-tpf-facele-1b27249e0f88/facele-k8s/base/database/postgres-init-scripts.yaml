    OWNER TO sa;\n\n--\n-- Name: TABLE t_conceptos; Type: COMMENT; Schema: facele;
    Owner: sa\n--\n\nCOMMENT ON TABLE facele.t_conceptos IS 'CRDETR un concepto: productos,
    servicios, etc.\nLa enumeración se obtiene invocando el WS \"FEParamGetTiposConcepto\"';\n\n\n--\n--
    Name: COLUMN t_conceptos.concepto; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON COLUMN facele.t_conceptos.concepto IS 'Concepto del Comprobante. \nValores
    permitidos: \n1=Productos \n2=Servicios \n3=Productos y Servicios';\n\n\n--\n--
    Name: COLUMN t_conceptos.descripcion; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
    ON COLUMN facele.t_conceptos.descripcion IS 'Descripción';\n\n\n--\n-- Name: spar_conceptos(facele.t_conceptos);
    Type: FUNCTION; Schema: facele; Owner: sa\n--\n\nCREATE FUNCTION facele.spar_conceptos(p_rec
