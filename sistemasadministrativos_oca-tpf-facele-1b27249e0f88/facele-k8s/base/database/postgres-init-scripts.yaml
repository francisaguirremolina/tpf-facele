    character varying, p_type character varying, p_member character varying) OWNER
    TO sa;\n\n--\n-- Name: pg_current_setting_or_null(text); Type: FUNCTION; Schema:
    public; Owner: sa\n--\n\nCREATE FUNCTION public.pg_current_setting_or_null(p_setting_name
    text) RETURNS text\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n    l_version   INTEGER;\n
    \   \nBEGIN\n    l_version := current_setting('server_version_num')::INTEGER;\n
    \   IF l_version >= 90600 THEN\n        RETURN current_setting(p_setting_name,
    true);\n    ELSE\n        DECLARE\n        BEGIN\n        \n            RETURN
    current_setting(p_setting_name);\n            \n        EXCEPTION WHEN undefined_object
    THEN\n        \n            RETURN NULL;\n            \n        END;\n    END
    IF;\nEND;\n$$;\n\n\nALTER FUNCTION public.pg_current_setting_or_null(p_setting_name
    text) OWNER TO sa;\n\n--\n-- Name: pg_dropuserforeignkey(character varying); Type:
    FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE FUNCTION public.pg_dropuserforeignkey(p_namepattern
    character varying) RETURNS void\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n\tl_rec
    RECORD;\n\tl_ddl TEXT;\nBEGIN\n\tFOR l_rec IN \n\t\tSELECT constraint_name, fullname
    FROM pg_userforeignkey WHERE constraint_name ILIKE p_NamePattern \n\t\tLOOP\n\n\t\tBEGIN\n\n\t\t\tl_ddl
    := 'ALTER TABLE ' || l_rec.fullname || ' DROP CONSTRAINT ' || l_rec.constraint_name;\n\n\t\t\tRAISE
    INFO '%', l_ddl;\n\n\t\t\tEXECUTE (l_ddl);\n\n\t\tEXCEPTION WHEN OTHERS THEN\n\t\t\t--
    Nada.\n\t\t\tRAISE INFO '     ** no eliminado ***';\n\t\tEND;\n\n\tEND LOOP;\nEND;\n$$;\n\n\nALTER
    FUNCTION public.pg_dropuserforeignkey(p_namepattern character varying) OWNER TO
    sa;\n\n--\n-- Name: pg_dropuserfunctions(character varying); Type: FUNCTION; Schema:
    public; Owner: sa\n--\n\nCREATE FUNCTION public.pg_dropuserfunctions(p_namepattern
    character varying) RETURNS void\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n\tl_rec
    RECORD;\n\tl_ddl TEXT;\nBEGIN\n\tFOR l_rec IN \n\t\tSELECT Declaration FROM pg_userfunctions
    WHERE FullName ILIKE p_NamePattern \n\t\tLOOP\n\n\t\tl_ddl := 'DROP FUNCTION '
    || l_rec.Declaration || ' CASCADE';\n\n\t\tRAISE INFO '%', l_ddl;\n\n\t\tEXECUTE
    (l_ddl);\n\n\tEND LOOP;\nEND;\n$$;\n\n\nALTER FUNCTION public.pg_dropuserfunctions(p_namepattern
    character varying) OWNER TO sa;\n\n--\n-- Name: pg_dropuserindexes(character varying);
    Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE FUNCTION public.pg_dropuserindexes(p_namepattern
    character varying) RETURNS void\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n\tl_rec
    RECORD;\n\tl_ddl TEXT;\n\tl_errorMsg TEXT;\n\nBEGIN\n\tFOR l_rec IN \n\t\tSELECT
    fullname FROM pg_userindexes WHERE fullname ILIKE p_NamePattern \n\t\tLOOP\n\n\t\tBEGIN\n\n\t\t\tl_ddl
    := 'DROP INDEX ' || l_rec.fullname;\n\n\t\t\tRAISE INFO '%', l_ddl;\n\n\t\t\tEXECUTE
    (l_ddl);\n\n\t\tEXCEPTION WHEN OTHERS THEN\n\n\t\t\tGET STACKED DIAGNOSTICS l_errorMsg
    = MESSAGE_TEXT;\n\n\t\t\tRAISE INFO 'Indice no eliminado: fullname=% msg=%', l_rec.fullname,
    l_errorMsg;\n\t\tEND;\n\n\tEND LOOP;\nEND;\n$$;\n\n\nALTER FUNCTION public.pg_dropuserindexes(p_namepattern
    character varying) OWNER TO sa;\n\n--\n-- Name: pg_dropuserpks(character varying);
    Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE FUNCTION public.pg_dropuserpks(p_namepattern
    character varying) RETURNS void\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n\tl_rec
    RECORD;\n\tl_ddl TEXT;\n\tl_errorMsg TEXT;\n\nBEGIN\n\tFOR l_rec IN \n\t\tSELECT
    constraint_schema, constraint_name, table_schema, table_name, fullname FROM pg_userpks
    WHERE fullname ILIKE p_NamePattern \n\t\tLOOP\n\n\t\tBEGIN\n\n\t\t\tl_ddl := 'ALTER
    TABLE ' || l_rec.fullname || ' DROP CONSTRAINT IF EXISTS ' || l_rec.constraint_name;\n\n\t\t\tRAISE
    INFO '%', l_ddl;\n\n\t\t\tEXECUTE (l_ddl);\n\n\t\tEXCEPTION WHEN OTHERS THEN\n\n\t\t\tGET
    STACKED DIAGNOSTICS l_errorMsg = MESSAGE_TEXT;\n\n\t\t\tRAISE INFO 'PK no eliminada:
    fullname=% msg=%', l_rec.fullname, l_errorMsg;\n\t\tEND;\n\n\tEND LOOP;\nEND;\n$$;\n\n\nALTER
    FUNCTION public.pg_dropuserpks(p_namepattern character varying) OWNER TO sa;\n\n--\n--
    Name: pg_dropuseruniques(character varying); Type: FUNCTION; Schema: public; Owner:
    sa\n--\n\nCREATE FUNCTION public.pg_dropuseruniques(p_namepattern character varying)
    RETURNS void\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n\tl_rec RECORD;\n\tl_ddl
    TEXT;\n\tl_errorMsg TEXT;\n\nBEGIN\n\tFOR l_rec IN \n\t\tSELECT constraint_name,
    fullname FROM pg_useruniques WHERE fullname ILIKE p_NamePattern \n\t\tLOOP\n\n\t\tBEGIN\n\n\t\t\tl_ddl
    := 'ALTER TABLE ' || l_rec.fullname || ' DROP CONSTRAINT ' || l_rec.constraint_name;\n\n\t\t\tRAISE
    INFO '%', l_ddl;\n\n\t\t\tEXECUTE (l_ddl);\n\n\t\tEXCEPTION WHEN OTHERS THEN\n\n\t\t\tGET
    STACKED DIAGNOSTICS l_errorMsg = MESSAGE_TEXT;\n\n\t\t\tRAISE INFO 'Indice no
    eliminado: constraint=% fullname=% msg=%', l_rec.constraint_name, l_rec.fullname,
    l_errorMsg;\n\t\tEND;\n\n\tEND LOOP;\nEND;\n$$;\n\n\nALTER FUNCTION public.pg_dropuseruniques(p_namepattern
    character varying) OWNER TO sa;\n\n--\n-- Name: pg_dropuserviews(character varying);
    Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE FUNCTION public.pg_dropuserviews(p_namepattern
    character varying) RETURNS void\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n\tl_rec
    RECORD;\n\tl_ddl TEXT;\nBEGIN\n\tFOR l_rec IN \n\t\tSELECT view_name FROM pg_userviews
    WHERE view_name ILIKE p_NamePattern \n\t\tLOOP\n\n\t\tBEGIN\n\n\t\t\tl_ddl :=
    'DROP VIEW ' || l_rec.view_name || ' CASCADE';\n\n\t\t\tRAISE INFO '%', l_ddl;\n\n\t\t\tEXECUTE
    (l_ddl);\n\n\t\tEXCEPTION WHEN OTHERS THEN\n\t\t\t-- La vista ya fue borrada en
    cascada\n\n\t\tEND;\n\n\tEND LOOP;\nEND;\n$$;\n\n\nALTER FUNCTION public.pg_dropuserviews(p_namepattern
    character varying) OWNER TO sa;\n\n--\n-- Name: pg_grantall(character varying,
    character varying, character varying); Type: FUNCTION; Schema: public; Owner:
    sa\n--\n\nCREATE FUNCTION public.pg_grantall(p_right character varying, p_objectpattern
    character varying, p_role character varying) RETURNS void\n    LANGUAGE plpgsql\n
    \   AS $$\nDECLARE\n\tl_rec\tRECORD;\n\tl_sql\tTEXT;\nBEGIN\n\t-- Esquemas\n\tFOR
    l_rec IN SELECT schema_name\n\t\tFROM pg_userschemata\n\t\tWHERE schema_name ILIKE
    p_ObjectPattern\n\t\tLOOP\n\t\t\n\t\tl_sql := 'GRANT ' || p_Right || ' ON SCHEMA
    ' || l_rec.schema_name || ' TO ' ||  quote_ident(p_Role);\n\n\t\tRAISE INFO '%',
    l_sql;\n\n\t\tEXECUTE l_sql;\n\tEND LOOP;\n\n\n-- Tablas\n\tFOR l_rec IN SELECT
    table_name\n\t\tFROM pg_usertables\n\t\tWHERE table_name ILIKE p_ObjectPattern\n\t\tLOOP\n\n\t\tl_sql
    := 'GRANT ' || p_Right || ' ON ' || l_rec.table_name || ' TO ' || quote_ident(p_Role);\n\n\t\tRAISE
    INFO '%', l_sql;\n\n\t\tEXECUTE l_sql;\n\tEND LOOP;\n\n-- Vistas\n\tFOR l_rec
    IN SELECT view_name\n\t\tFROM pg_userviews\n\t\tWHERE view_name ILIKE p_ObjectPattern\n\t\tLOOP\n\n\t\tl_sql
    := 'GRANT ' || p_Right || ' ON ' || l_rec.view_name || ' TO ' || quote_ident(p_Role);\n\n\t\tRAISE
    INFO '%', l_sql;\n\n\t\tEXECUTE l_sql;\n\tEND LOOP;\n\n-- Secuencias\n\tFOR l_rec
    IN SELECT sequence_name\n\t\tFROM pg_usersequences\n\t\tWHERE sequence_name ILIKE
    p_ObjectPattern\n\t\tLOOP\n\n\t\tl_sql := 'GRANT ' || p_Right || ' ON SEQUENCE
    ' || l_rec.sequence_name || ' TO ' || quote_ident(p_Role);\n\n\t\tRAISE INFO '%',
    l_sql;\n\n\t\tEXECUTE l_sql;\n\tEND LOOP;\n\n-- Funciones\n\tFOR l_rec IN SELECT
    declaration\n\t\tFROM pg_userfunctions\n\t\tWHERE fullname ILIKE p_ObjectPattern\n\t\tLOOP\n\n\t\tl_sql
    := 'GRANT ' || p_Right || ' ON FUNCTION ' || l_rec.declaration || ' TO ' || quote_ident(p_Role);\n\n\t\tRAISE
    INFO '%', l_sql;\n\n\t\tEXECUTE l_sql;\n\tEND LOOP;\n\nEND;\n$$;\n\n\nALTER FUNCTION
    public.pg_grantall(p_right character varying, p_objectpattern character varying,
    p_role character varying) OWNER TO sa;\n\n--\n-- Name: pg_parseexception(text,
    text, text, text, text); Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE
    FUNCTION public.pg_parseexception(p_sqlstate text, p_errmsg text, p_tablename
    text, p_operation text, p_recordkey text) RETURNS text\n    LANGUAGE plpgsql\n
    \   AS $$\nDECLARE\n\tl_toReturn\tTEXT;\n\tl_arg1\t\tTEXT;\n\tl_arg2\t\tTEXT;\nBEGIN\n\n\t--
    raise info 'SQLSTATE=% ERRMSG=% TABLENAME=% OPERATION=% RECORDKEY=%', p_sqlstate,
    p_errmsg, p_tablename, p_operation, p_recordkey;\n\n\tl_toReturn := '; al ' ||
    COALESCE(p_operation, '?')\n\t\t|| COALESCE(' el registro \"' || p_recordKey,
    '')\n\t\t|| COALESCE('\" de la tabla \"' || pg_ClientMsg(p_tableName, 'table_name',
    null) || '\"', '');\n\n\n\tIF p_sqlState = '22001' THEN\n\t\t-- Valor muy largo
    para campo alfanumérico: \"value too long for type character varying(10)\"\n\t\tl_arg1
    := substring(p_errMsg from 'value too long for type #\"%#\"' for '#');\n\t\tl_toReturn
    := COALESCE('valor muy largo para el tipo de dato ' || l_arg1, p_errMsg) || l_toReturn;\n\n\t\tRETURN
    l_toReturn;\n\n\tEND IF;\n\n\tIF p_sqlState = '22P02' THEN\n\t\t-- Sintaxis inválida:
    \"invalid input syntax for integer: \"a\"\"\n\t\tl_arg1 := substring(p_errMsg
    from 'invalid input syntax for #\"%#\"' for '#');\n\t\tl_toReturn := COALESCE('sintaxis
    inválida para el tipo de dato ' || l_arg1, p_errMsg) || l_toReturn;\n\n\t\tRETURN
    l_toReturn;\n\n\tEND IF;\n\n\tIF p_sqlState = '23502' THEN\n\t\t-- \"null value
    in column \"t\" violates not-null constraint\"\n\t\tl_arg1 := substring(p_errMsg
    from 'null value in column #\"%#\" violates not-null constraint' for '#');\n\t\tl_toReturn
    := COALESCE('la columna ' || l_arg1 || ' no acepta un valor nulo', p_errMsg) ||
    l_toReturn;\n\n\t\tRETURN l_toReturn;\n\n\tEND IF;\n\n\t-- Violación de Foreign
    Keys\n\tIF p_sqlState = '23503' THEN\n\t\t-- Inserción de hijo sin padre: \"insert
    or update on table \"ch\" violates foreign key constraint \"fk_cli_ccc_18018\"
    \"\n\t\tl_arg1 := substring(p_errMsg from 'insert or update on table \"t_#\"%#\"\"
    violates foreign key constraint %' for '#');\n\n\t\tIF l_arg1 IS NULL THEN\n\n\t\t\t--
    Eliminación de padre con hijos: \"update or delete on table \"t\" violates foreign
    key constraint \"fk_cli_ccc_18018\" on table \"ch\" \"\n\t\t\tl_arg1 := substring(p_errMsg
    from 'update or delete on table \"t_#\"%#\"\" violates foreign key constraint
    %' for '#');\n\t\t\tl_arg2 := substring(p_errMsg from 'update or delete on table
    % violates foreign key constraint % on table \"t_#\"%#\"\"' for '#');\n\n\t\t\tl_toReturn
    := COALESCE('del registro de la tabla \"' || pg_ClientMsg(l_arg1, 'table_name',
    NULL)\n\t\t\t|| '\" dependen uno o más registros en la tabla \"' || pg_ClientMsg(l_arg2,
    'table_name', NULL) || '\"', p_errMsg)  || l_toReturn;\n\n\t\tELSE\n\t\t\tl_arg2
    := substring(p_errMsg from 'insert or update on table % violates foreign key constraint
    \"#\"%#\"\"' for '#');\n\n\t\t\tl_toReturn := COALESCE('la tabla \"' || pg_ClientMsg(l_arg1,
    'table_name', NULL) \n\t\t\t|| '\" depende de un registro padre que no existe,
    en la tabla \"' \n\t\t\t|| pg_ClientMsg(l_arg2, 'fk_parentname', NULL) || '\"',
    p_errMsg)  || l_toReturn;\n\n\t\tEND IF;\n\n\t\tRETURN l_toReturn;\n\n\tEND IF;\n\n\tIF
    p_sqlState = '23505' THEN\n\t\t-- Duplicidad de clave primaria: \"duplicate key
    value violates unique constraint \"pk_clientes\" \"\n\t\t-- Duplicidad de índice
    único:   \"duplicate key value violates unique constraint \"ak_clientes_1\" \"\n\t\t--
    Duplicidad de índice único parcial:   \"duplicate key value violates unique constraint
    \"pak_clientes_1\" \"\n\t\t-- \"llave duplicada viola restricción unique \"ak_perfis_1\"
    \"\n\t\t--                                duplicate key value violates unique
    constraint \"pk_estadosciviles\"\n\n\t\tl_arg1 := substring(p_errMsg from 'duplicate
    key value violates unique constraint \"pk_#\"%#\"\"' for '#');\n\n\t\tIF l_arg1
    NOTNULL THEN\n\n\t\t\t-- Violación de clave primaria\n\t\t\tl_arg2 := pg_ClientMsg(l_arg1,
    'table_pk', NULL);\n\n\t\t\tl_toReturn := COALESCE('el valor de ' || l_arg2 \n\t\t\t||
    ' debe ser único para toda la tabla ' \n\t\t\t|| pg_ClientMsg(l_arg1, 'table_name',
    NULL), p_errMsg)  || l_toReturn;\n\n\n\t\tELSE\n\n\t\t\t-- Violación de índice
    único\n\n\t\t\tl_arg1 := substring(p_errMsg from 'duplicate key value violates
    unique constraint \"ak_#\"%#\"\"' for '#');\n\n\t\t\tIF l_arg1 IS NULL THEN\n\n\t\t\t\tl_arg1
    := substring(p_errMsg from 'duplicate key value violates unique constraint \"pak_#\"%#\"\"'
    for '#');\n\n\t\t\tEND IF;\n\n\t\t\t--l_toReturn := l_toReturn || COALESCE(' un
    valor duplicado viola la restricción de unicidad que establece que: ' \n            --
    \   || pg_ClientMsg(l_arg1, 'index_unique', NULL), p_errMsg);\n            \n\t\t\tl_toReturn
    := pg_ClientMsg(l_arg1, 'index_unique', NULL)|| '; un valor duplicado viola la
    restricción de unicidad; '\n                || l_toReturn;\n\n\t\tEND IF;\n\n\t\tRETURN
    COALESCE(l_toReturn, p_errMsg);\n\n\tEND IF;\n\n\tIF p_sqlState = '23514' THEN\n\t\t--
    Restricción CHECK de dominio: \"value for domain d violates check constraint \"d\"
    \"\n\t\t-- Restricción CHECK de tabla: \"new row for relation \"t_table\" violates
    check constraint \"t_table_check\" \"\n\n\t\tl_arg1 := substring(p_errMsg from
    'value for domain #\"%#\" violates check constraint %' for '#');\n\n\t\tIF l_arg1
    IS NULL THEN\n\n\t\t\tl_arg1 := substring(p_errMsg from 'new row for relation
    \"t_#\"%#\"\" violates check constraint %' for '#');\n\n\t\t\tl_arg2 := substring(p_errMsg
    from '% violates check constraint #\"%#\"' for '#');\n\n\t\t\t\n\t\t\t-- l_toReturn
    := l_toReturn || COALESCE(' la nueva fila para la tabla ' || l_arg1 || ' no cumple
    la siguiente condición: ' || l_arg2, p_errMsg);\n\t\t\tl_toReturn := COALESCE('la
    nueva fila para la tabla ' || l_arg1 \n\t\t\t\t\t|| ' no cumple la siguiente condición:
    ' \n\t\t\t\t\t|| pg_clientMsg(l_arg1, 'table_check', null), p_errMsg)  || l_toReturn;\n\n\t\tELSE\n\n\t\t\tl_toReturn
    := COALESCE('valor inválido para el dominio ' || l_arg1, p_errMsg) || l_toReturn;\n\n\t\tEND
    IF;\n\n\t\tRETURN l_toReturn;\n\n\tEND IF;\n\n\tl_toReturn := ' Código ' || COALESCE(p_sqlState,
    '?') || ': ' || COALESCE(p_errMsg, '?')  || l_toReturn;\n\n\tRETURN l_toReturn;\n\nEND\n$$;\n\n\nALTER
    FUNCTION public.pg_parseexception(p_sqlstate text, p_errmsg text, p_tablename
    text, p_operation text, p_recordkey text) OWNER TO sa;\n\n--\n-- Name: spc_createviewdotmodel();
    Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE FUNCTION public.spc_createviewdotmodel()
    RETURNS SETOF text\n    LANGUAGE plpgsql\n    AS $$\nDECLARE \n\tl_line\tINT;\n\tl_text\tTEXT;\nBEGIN\n\nFOR
    l_line, l_text IN\n\t-- Cabecera del archivo ==================================\n\tSELECT
    1010 AS Linea, 'digraph model {'\n\tUNION\n\tSELECT 1020, '   size=\"8.27,11.69\"'\n\tUNION\n\t--SELECT
    1030, '   ratio=auto'\n\t--UNION\n\tSELECT 1040, '   nodesep=0.5'\n\tUNION\n\tSELECT
    1050, '   ranksep=0.5'\n\tUNION\n\tSELECT 1060, '   rankdir=LR'\n\tUNION\n\tSELECT
    1070, '   overlap=false'\n\tUNION\n    \tSELECT 1080, '   node [fontname=Arial]'\n\n\tUNION\n\n\t--
    Nodos\n\tSELECT 2000, obj_fqn || node_style || ';'\n\t\tFROM pg_related_objects_dotted\n\n\tUNION\n\n\t--
    Dependencias\n\tSELECT 3000, REPLACE(dependency, '.', '__')\n\t\tFROM pg_view_usage_dotted\n\n\tUNION\n\n\t--
    Cierre del archivo\n\tSELECT 9000, '}'\t\t\n\n\tLOOP\n\n\t\tRETURN NEXT l_text;\n\n\tEND
    LOOP;\n\nEND\n$$;\n\n\nALTER FUNCTION public.spc_createviewdotmodel() OWNER TO
    sa;\n\n--\n-- Name: spc_deletetemptables(); Type: FUNCTION; Schema: public; Owner:
    sa\n--\n\nCREATE FUNCTION public.spc_deletetemptables() RETURNS void\n    LANGUAGE
    plpgsql\n    AS $$\n/**************************************************************************************\n
    * Descubre todas las funciones llamadas *.spc_DelTmpTab*() y las ejecuta dinámicamente\n**************************************************************************************/\nDECLARE\n
    \   l_rec   RECORD;\n    l_sql   TEXT;\n\nBEGIN\n    FOR l_rec IN SELECT routine_schema,
    routine_name\n    FROM information_schema.routines \n    WHERE routine_name ILIKE
    'spc_DelTmpTab_%' LOOP\n    \n        l_sql := 'SELECT ' || l_rec.routine_schema
    || '.' || l_rec.routine_name || '();';\n        \n        -- RAISE INFO '%', l_sql;\n
    \       \n        EXECUTE l_sql;\n        \n    END LOOP;\n\nEND\n$$;\n\n\nALTER
    FUNCTION public.spc_deletetemptables() OWNER TO sa;\n\n--\n-- Name: spc_deltmptab_facele_tpf_public();
    Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE FUNCTION public.spc_deltmptab_facele_tpf_public()
    RETURNS void\n    LANGUAGE plpgsql\n    AS $$\n/***************************************************\n\nElimina
    todos los registros de las tablas temporales del esquema público\n\n****************************************************/\nBEGIN\n\nEND\n$$;\n\n\nALTER
    FUNCTION public.spc_deltmptab_facele_tpf_public() OWNER TO sa;\n\n--\n-- Name:
    spc_initschseq_facele_tpf_public(); Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE
    FUNCTION public.spc_initschseq_facele_tpf_public() RETURNS void\n    LANGUAGE
    plpgsql\n    AS $$\nDECLARE\n\tl_min\tint8;\n\tl_max\tint8;\n\tl_inc\tint8;\n\tl_mod\tint8;\n\nBEGIN\n\tl_min\t:=
    0;\n\tl_max\t:= 1000000000;\n\tl_inc\t:= 1;\n\tl_mod\t:= 0;\n\t\n\tIF EXISTS (SELECT
    true FROM information_schema.tables \n\t\tWHERE table_schema = 'sync' AND table_name
    = 't_masterservers' ) THEN\n\n\t\t-- Esquema de replicación implementado\n\n\t\tSELECT
    MinSequenceValue, MaxSequenceValue, IncSequenceValue, ModSequenceValue\n\t\t\tINTO
    l_min, l_max, l_inc, l_mod\n\t\t\tFROM sync.t_masterservers \n\t\t\tWHERE ActiveServer
    = 1;\n\n        IF NOT FOUND THEN\n        \n            l_min\t:= 0;\n\t       l_max\t:=
    1000000000;\n\t       l_inc\t:= 1;\n\t       l_mod\t:= 0;\n\t\n        END IF;\n
    \       \n\tEND IF;\n\n\nEND    \n$$;\n\n\nALTER FUNCTION public.spc_initschseq_facele_tpf_public()
    OWNER TO sa;\n\n--\n-- Name: spc_initsequence(character varying, character varying,
    character varying, bigint, bigint, bigint, bigint); Type: FUNCTION; Schema: public;
    Owner: sa\n--\n\nCREATE FUNCTION public.spc_initsequence(p_tablefqn character
    varying, p_pkcolumn character varying, p_seqfqn character varying, p_minsequencevalue
    bigint, p_maxsequencevalue bigint, p_incsequencevalue bigint, p_modsequencevalue
    bigint) RETURNS bigint\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n    l_sqlString
    \    TEXT;\n    l_newValue      BIGINT;\n    l_modValue      BIGINT;\n\nBEGIN\n\t--
    Control de parámetros de entrada\n\tIF p_TableFQN IS NULL THEN\n\t\tRAISE EXCEPTION
    '{Debe proveerse un valor para el parámetro p_TableFQN de la función InitSequence}';\n\tEND
    IF;\n\tIF p_PKColumn IS NULL THEN\n\t\tRAISE EXCEPTION '{Debe proveerse un valor
    para el parámetro p_PKColumn de la función InitSequence}';\n\tEND IF;\n\tIF p_SeqFQN
    IS NULL THEN\n\t\tRAISE EXCEPTION '{Debe proveerse un valor para el parámetro
    p_SeqFQN de la función InitSequence}';\n\tEND IF;\n\tIF p_MinSequenceValue IS
    NULL THEN\n\t\tRAISE EXCEPTION '{Debe proveerse un valor para el parámetro p_MinSequenceValue
    de la función InitSequence}';\n\tEND IF;\n\tIF p_MaxSequenceValue IS NULL THEN\n\t\tRAISE
    EXCEPTION '{Debe proveerse un valor para el parámetro p_MaxSequenceValue de la
    función InitSequence}';\n\tEND IF;\n\tIF p_IncSequenceValue IS NULL THEN\n\t\tRAISE
    EXCEPTION '{Debe proveerse un valor para el parámetro p_IncSequenceValue de la
    función InitSequence}';\n\tEND IF;\n\tIF p_ModSequenceValue IS NULL THEN\n\t\tRAISE
    EXCEPTION '{Debe proveerse un valor para el parámetro p_ModSequenceValue de la
    función InitSequence}';\n\tEND IF;\n\n\tl_sqlString := 'SELECT MAX(' || p_PKColumn
    || ') FROM ' || p_TableFQN \n\t\t|| ' WHERE ' || p_PKColumn || ' BETWEEN ' ||
    p_MinSequenceValue || ' AND ' || p_MaxSequenceValue;\n\n\tEXECUTE l_sqlString
    INTO l_newValue;\n\n\tIF l_newValue IS NULL THEN\n\n\t\t-- Primer valor de la
    secuencia\n\n\t\tl_newValue := p_MinSequenceValue;\n\n\tELSE\n\n\t\tl_newValue
    := l_newValue + p_IncSequenceValue;\n\n\tEND IF;\n\n    IF p_IncSequenceValue
    >= 2 THEN\n    \n\t   WHILE (l_newValue % p_IncSequenceValue <> p_ModSequenceValue
    ) LOOP\n\n\t\t  l_newValue := l_newValue + 1;\n\n\t   END LOOP;\n\n    END IF;\n\n\tl_sqlString
    := 'ALTER SEQUENCE ' || p_SeqFQN || \n\t\t' INCREMENT BY ' || p_IncSequenceValue
    || \n\t\t' MINVALUE ' || p_MinSequenceValue || \n\t\t' MAXVALUE ' || p_MaxSequenceValue
    || \n\t\t' START WITH ' || l_newValue ||\n\t\t' RESTART WITH ' || l_newValue;\n
    \   \n\tEXECUTE l_sqlString USING p_SeqFQN, p_IncSequenceValue, p_MinSequenceValue,
    \n        \tp_MaxSequenceValue, l_newValue;\n    \n\tRETURN l_newValue;\n    \nEND\n$$;\n\n\nALTER
    FUNCTION public.spc_initsequence(p_tablefqn character varying, p_pkcolumn character
    varying, p_seqfqn character varying, p_minsequencevalue bigint, p_maxsequencevalue
    bigint, p_incsequencevalue bigint, p_modsequencevalue bigint) OWNER TO sa;\n\n--\n--
    Name: spc_initsequences(); Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE
    FUNCTION public.spc_initsequences() RETURNS void\n    LANGUAGE plpgsql\n    AS
    $$\nDECLARE\n    l_rec   RECORD;\n    l_sql   TEXT;\n    \nBEGIN\n    FOR l_rec
    IN SELECT routine_schema, routine_name\n    FROM information_schema.routines \n
    \   WHERE routine_name ILIKE 'spc_InitSchSeq_%' LOOP\n    \n        l_sql := 'SELECT
    ' || l_rec.routine_schema || '.' || l_rec.routine_name || '();';\n        \n        --
    RAISE INFO '%', l_sql;\n        \n        EXECUTE l_sql;\n        \n    END LOOP;\n\nEND\n$$;\n\n\nALTER
    FUNCTION public.spc_initsequences() OWNER TO sa;\n\n--\n-- Name: spc_modelselectlist();
    Type: FUNCTION; Schema: public; Owner: sa\n--\n\nCREATE FUNCTION public.spc_modelselectlist()
    RETURNS SETOF text\n    LANGUAGE plpgsql\n    AS $$\nDECLARE\n    l_rec   RECORD;\n
    \   l_sql   TEXT;\n    \nBEGIN\n    l_sql := '';\n    \n    FOR l_rec IN SELECT
    routine_schema, routine_name\n    FROM information_schema.routines \n    WHERE
    routine_name ILIKE 'spc_OneModelSelectList_%' LOOP\n    \n        IF l_sql <>
    '' THEN\n            l_sql := l_sql || ' UNION ';\n        END IF;\n        \n
    \       l_sql := l_sql || 'SELECT * FROM ' || l_rec.routine_name || '()';\n        \n
    \   END LOOP;\n    \n    -- RAISE INFO '%', l_sql;\n        \n    RETURN QUERY
    EXECUTE l_sql;\n        \n\nEND\n$$;\n\n\nALTER FUNCTION public.spc_modelselectlist()
    OWNER TO sa;\n\n--\n-- Name: spc_onemodelselectlist_facele_tpf(); Type: FUNCTION;
