    facele.fechahora,\n    pdffilename facele.fullfilename,\n    modelocopias facele.descripcion,\n
    \   estadopdf facele.estadopdf DEFAULT 'P'::bpchar,\n    idlotefacturacion facele.idlotefacturacion,\n
