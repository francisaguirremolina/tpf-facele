    facele.spu_Paises (\n\n        p_rec.IdPais ,\n        p_rec.Descripcion ,\n        p_rec.IdPais
    /* PRIMARY KEY */        );\nEND;\n$$;\n\n\nALTER FUNCTION facele.spur_paises(p_rec
    facele.t_paises) OWNER TO sa;\n\n--\n-- Name: pg_clientmsg(character varying,
    character varying, character varying); Type: FUNCTION; Schema: public; Owner:
    sa\n--\n\nCREATE FUNCTION public.pg_clientmsg(p_table character varying, p_type
    character varying, p_member character varying) RETURNS text\n    LANGUAGE plpgsql
    IMMUTABLE\n    AS $$\n/**********************************************\nDevuelve
    mensajes destinados al cliente.\n\np_table es el nombre físico de la tabla a buscar
    (incluido el prefijo y el esquema; o sin esquema ni prefijo)\nPor cada objeto
    busca primero que p_table sea igual al FQN (incluyendo el esquema y prefijo)\nSi
    no lo encuentra, busca nuevamente comparando sólo el nombre (sin esquema ni prefijo),
    corriendo el riesgo de encontrar una tabla con el mismo nombre, en otro esquema.\n\np_type
    es el tipo de mensaje a buscar. Es una constante fija que\npuede tomar el valor:\n\ntable_name,
    para el Caption de la tabla; si no hay caption, devuelve el Name\ntable_check,
    para el mensaje CheckMsg de la tabla; si no hay mensaje, devuelve la expresión
    Check\ncolumn_name, para el Caption de la columna; si no hay caption, devuelve
    el Name\ncolumn_check, para el mensaje CheckMsg de la columna; si no hay mensaje,
    devuelve la expresión Check\nindex_unique, para el mensaje UniqueMsg del índice;
    si no hay mensaje, construye uno basado en las columnas del índice\ntable_pk,
    para la lista de Captions(o Names) de las columnas de la clave primaria\n\np_member
    Miembro de la entidad p_table (por ejemplo, nombre de columna)\n\n**********************************************/\nBEGIN\n\nIF
    p_type = 'index_unique' THEN\n\n\tIF p_table ILIKE 'Conceptos_1' THEN\n\t\tRETURN
    'El nombre del concepto debe ser único';\n\tEND IF;\n\n\tIF p_table ILIKE 'CondIvaReceptores_1'
    THEN\n\t\tRETURN 'La descripción de la condición debe ser única';\n\tEND IF;\n\n\tIF
    p_table ILIKE 'FEXDstCuits_1' THEN\n\t\tRETURN 'La descripción debe ser única';\n\tEND
    IF;\n\n\tIF p_table ILIKE 'FEXDstPaises_1' THEN\n\t\tRETURN 'La descripción debe
    ser única';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEXIdiomas_1' THEN\n\t\tRETURN 'La
    descripción debe ser única';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEXIncoterms_1'
    THEN\n\t\tRETURN 'La descripción debe ser única';\n\tEND IF;\n\n\tIF p_table ILIKE
    'FEXTiposExpo_1' THEN\n\t\tRETURN 'La descripción debe ser única';\n\tEND IF;\n\n\tIF
    p_table ILIKE 'FEXUnidadesMedida_1' THEN\n\t\tRETURN 'La descripción debe ser
    única';\n\tEND IF;\n\n\tIF p_table ILIKE 'IPCColas_1' THEN\n\t\tRETURN 'El tipo
    de cola debe ser único';\n\tEND IF;\n\n\tIF p_table ILIKE 'Monedas_1' THEN\n\t\tRETURN
    'El nombre de la moneda debe ser único';\n\tEND IF;\n\n\tIF p_table ILIKE 'Paises_1'
    THEN\n\t\tRETURN 'El nombre del país debe ser único';\n\tEND IF;\n\n\tIF p_table
    ILIKE 'FECbteTipos_1' THEN\n\t\tRETURN 'La descripción del tipo de comprobante
    debe ser única';\n\tEND IF;\n\n\tIF p_table ILIKE 'FECotizMonedas_1' THEN\n\t\tRETURN
    'La cotización en cada fecha debe ser única para cada moneda';\n\tEND IF;\n\n\tIF
    p_table ILIKE 'FECuits_2' THEN\n\t\tRETURN 'La descripción del CUIT debe ser única';\n\tEND
    IF;\n\n\tIF p_table ILIKE 'FEDocTipos_1' THEN\n\t\tRETURN 'La descripción del
    tipo de documento debe ser única';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEIVATipos_1'
    THEN\n\t\tRETURN 'La descripción del tipo de IVA debe ser única';\n\tEND IF;\n\n\tIF
    p_table ILIKE 'FEIVATipos_2' THEN\n\t\tRETURN 'La alícuota de IVA debe ser única';\n\tEND
    IF;\n\n\tIF p_table ILIKE 'FEOpcionalesTipos_1' THEN\n\t\tRETURN 'La descripción
    del opcional debe ser única';\n\tEND IF;\n\n\tIF p_table ILIKE 'FETributosTipos_1'
    THEN\n\t\tRETURN 'La descripción del tributo debe ser única';\n\tEND IF;\n\n\tIF
    p_table ILIKE 'ModeloCopias_2' THEN\n\t\tRETURN 'El nombre de la copia debe ser
    único en cada modelo';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEPtosVta_1' THEN\n\t\tRETURN
    'El punto de venta debe ser único en cada CUIT';\n\tEND IF;\n\n\tIF p_table ILIKE
    'FEPtosVta_2' THEN\n\t\tRETURN 'La descripción del punto de venta debe ser único
    en cada CUIT';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEComprobantes_2' THEN\n\t\tRETURN
    'La combinación (Tipo/PtoVta/CbteDesde) debe ser única';\n\tEND IF;\n\n\tIF p_table
    ILIKE 'FEComprobantesAsoc_1' THEN\n\t\tRETURN 'El comprobante asociado solo puede
    asociarse una vez';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEComprobantesIva_1' THEN\n\t\tRETURN
    'La alícuota de IVA debe declararse solo una vez en cada comprobante';\n\tEND
    IF;\n\n\tIF p_table ILIKE 'FEComprobantesOpc_1' THEN\n\t\tRETURN 'El valor opcional
    debe declararse solo una vez en cada comprobante';\n\tEND IF;\n\nEND IF;\n\n\nIF
    p_type = 'table_name' THEN\n\t-- Busca el FQN\n\n\tIF p_table = 'facele.t_Conceptos'
    THEN\n\t\tRETURN 'Conceptos';\n\tEND IF;\n\tIF p_table = 'facele.t_FECondIvaReceptores'
    THEN\n\t\tRETURN 'Condiciones de IVA de receptores';\n\tEND IF;\n\tIF p_table
    = 'facele.t_FEXDstCuits' THEN\n\t\tRETURN 'CUITs de destino';\n\tEND IF;\n\tIF
    p_table = 'facele.t_FEXDstPaises' THEN\n\t\tRETURN 'Países de destino';\n\tEND
    IF;\n\tIF p_table = 'facele.t_FEXIdiomas' THEN\n\t\tRETURN 'Idiomas';\n\tEND IF;\n\tIF
    p_table = 'facele.t_FEXIncoterms' THEN\n\t\tRETURN 'Incoterms';\n\tEND IF;\n\tIF
    p_table = 'facele.t_FEXPermisos' THEN\n\t\tRETURN 'Permisos de exportación';\n\tEND
    IF;\n\tIF p_table = 'facele.t_FEXTiposExpo' THEN\n\t\tRETURN 'Tipos de exportaciones';\n\tEND
    IF;\n\tIF p_table = 'facele.t_FEXUnidadesMedida' THEN\n\t\tRETURN 'Unidades de
    medida';\n\tEND IF;\n\tIF p_table = 'facele.t_IPCColas' THEN\n\t\tRETURN 'IPC
    de colas';\n\tEND IF;\n\tIF p_table = 'facele.t_Monedas' THEN\n\t\tRETURN 'Monedas';\n\tEND
    IF;\n\tIF p_table = 'facele.t_Paises' THEN\n\t\tRETURN 'Países';\n\tEND IF;\n\tIF
    p_table = 'facele.t_FECbteTipos' THEN\n\t\tRETURN 'Tipos de comprobantes';\n\tEND
    IF;\n\tIF p_table = 'facele.t_FECotizMonedas' THEN\n\t\tRETURN 'Cotizac. de monedas';\n\tEND
    IF;\n\tIF p_table = 'facele.t_FECuits' THEN\n\t\tRETURN 'CUITs';\n\tEND IF;\n\tIF
    p_table = 'facele.t_FEDocTipos' THEN\n\t\tRETURN 'Tipos de docum. de ident.';\n\tEND
    IF;\n\tIF p_table = 'facele.t_FEIVATipos' THEN\n\t\tRETURN 'Tipos de IVA';\n\tEND
    IF;\n\tIF p_table = 'facele.t_FEOpcionalesTipos' THEN\n\t\tRETURN 'Tipos de valores
    opc.';\n\tEND IF;\n\tIF p_table = 'facele.t_FETributosTipos' THEN\n\t\tRETURN
    'Tipos de tributos';\n\tEND IF;\n\tIF p_table = 'facele.t_ModeloCopias' THEN\n\t\tRETURN
    'Modelos de copias de documentos';\n\tEND IF;\n\tIF p_table = 'facele.t_FEPtosVta'
    THEN\n\t\tRETURN 'Puntos de venta';\n\tEND IF;\n\tIF p_table = 'facele.t_FEComprobantes'
    THEN\n\t\tRETURN 'Comprobantes electrónicos';\n\tEND IF;\n\tIF p_table = 'facele.t_FEComprobantesAsoc'
    THEN\n\t\tRETURN 'Compr. electr. asociados';\n\tEND IF;\n\tIF p_table = 'facele.t_FEComprobantesDet'
    THEN\n\t\tRETURN 'Detalles de comprobantes';\n\tEND IF;\n\tIF p_table = 'facele.t_FEComprobantesIva'
    THEN\n\t\tRETURN 'IVAs de comprob. electr.';\n\tEND IF;\n\tIF p_table = 'facele.t_FEComprobantesOpc'
    THEN\n\t\tRETURN 'Opcionales de comprob. electr.';\n\tEND IF;\n\tIF p_table =
    'facele.t_FEComprobantesTrib' THEN\n\t\tRETURN 'Tributos de compr. electr.';\n\tEND
    IF;\n\t-- Busca sólo el nombre\n\n\tIF p_table ILIKE 'Conceptos' THEN\n\t\tRETURN
    'Conceptos';\n\tEND IF;\n\tIF p_table ILIKE 'FECondIvaReceptores' THEN\n\t\tRETURN
    'Condiciones de IVA de receptores';\n\tEND IF;\n\tIF p_table ILIKE 'FEXDstCuits'
    THEN\n\t\tRETURN 'CUITs de destino';\n\tEND IF;\n\tIF p_table ILIKE 'FEXDstPaises'
    THEN\n\t\tRETURN 'Países de destino';\n\tEND IF;\n\tIF p_table ILIKE 'FEXIdiomas'
    THEN\n\t\tRETURN 'Idiomas';\n\tEND IF;\n\tIF p_table ILIKE 'FEXIncoterms' THEN\n\t\tRETURN
    'Incoterms';\n\tEND IF;\n\tIF p_table ILIKE 'FEXPermisos' THEN\n\t\tRETURN 'Permisos
    de exportación';\n\tEND IF;\n\tIF p_table ILIKE 'FEXTiposExpo' THEN\n\t\tRETURN
    'Tipos de exportaciones';\n\tEND IF;\n\tIF p_table ILIKE 'FEXUnidadesMedida' THEN\n\t\tRETURN
    'Unidades de medida';\n\tEND IF;\n\tIF p_table ILIKE 'IPCColas' THEN\n\t\tRETURN
    'IPC de colas';\n\tEND IF;\n\tIF p_table ILIKE 'Monedas' THEN\n\t\tRETURN 'Monedas';\n\tEND
    IF;\n\tIF p_table ILIKE 'Paises' THEN\n\t\tRETURN 'Países';\n\tEND IF;\n\tIF p_table
    ILIKE 'FECbteTipos' THEN\n\t\tRETURN 'Tipos de comprobantes';\n\tEND IF;\n\tIF
    p_table ILIKE 'FECotizMonedas' THEN\n\t\tRETURN 'Cotizac. de monedas';\n\tEND
    IF;\n\tIF p_table ILIKE 'FECuits' THEN\n\t\tRETURN 'CUITs';\n\tEND IF;\n\tIF p_table
    ILIKE 'FEDocTipos' THEN\n\t\tRETURN 'Tipos de docum. de ident.';\n\tEND IF;\n\tIF
    p_table ILIKE 'FEIVATipos' THEN\n\t\tRETURN 'Tipos de IVA';\n\tEND IF;\n\tIF p_table
    ILIKE 'FEOpcionalesTipos' THEN\n\t\tRETURN 'Tipos de valores opc.';\n\tEND IF;\n\tIF
    p_table ILIKE 'FETributosTipos' THEN\n\t\tRETURN 'Tipos de tributos';\n\tEND IF;\n\tIF
    p_table ILIKE 'ModeloCopias' THEN\n\t\tRETURN 'Modelos de copias de documentos';\n\tEND
    IF;\n\tIF p_table ILIKE 'FEPtosVta' THEN\n\t\tRETURN 'Puntos de venta';\n\tEND
    IF;\n\tIF p_table ILIKE 'FEComprobantes' THEN\n\t\tRETURN 'Comprobantes electrónicos';\n\tEND
    IF;\n\tIF p_table ILIKE 'FEComprobantesAsoc' THEN\n\t\tRETURN 'Compr. electr.
    asociados';\n\tEND IF;\n\tIF p_table ILIKE 'FEComprobantesDet' THEN\n\t\tRETURN
    'Detalles de comprobantes';\n\tEND IF;\n\tIF p_table ILIKE 'FEComprobantesIva'
    THEN\n\t\tRETURN 'IVAs de comprob. electr.';\n\tEND IF;\n\tIF p_table ILIKE 'FEComprobantesOpc'
    THEN\n\t\tRETURN 'Opcionales de comprob. electr.';\n\tEND IF;\n\tIF p_table ILIKE
    'FEComprobantesTrib' THEN\n\t\tRETURN 'Tributos de compr. electr.';\n\tEND IF;\n\t--
    Caption no encontrado\n\tRETURN p_table;\n\nEND IF;\n\nIF p_type = 'table_check'
    THEN\n\t-- Busca el FQN\n\n\tIF p_table = 'facele.t_Conceptos' THEN\n\t\tRETURN
    'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND
    IF;\n\n\tIF p_table = 'facele.t_FEXIdiomas' THEN\n\t\tRETURN 'Si se indica la
    \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND IF;\n\n\tIF p_table
    = 'facele.t_FEXIncoterms' THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe
    ser posterior a \"Fecha desde\"';\n\tEND IF;\n\n\tIF p_table = 'facele.t_FEXTiposExpo'
    THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha
    desde\"';\n\tEND IF;\n\n\tIF p_table = 'facele.t_FEXUnidadesMedida' THEN\n\t\tRETURN
    'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND
    IF;\n\n\tIF p_table = 'facele.t_Monedas' THEN\n\t\tRETURN 'Si se indica la \"Fecha
    hasta\", debe ser posterior a \"Fecha desde\"; la moneda debe usarse para uso
    nacional, para exportación, o ambos';\n\tEND IF;\n\n\tIF p_table = 'facele.t_FECbteTipos'
    THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha
    desde\"; el tipo de comprobante debe usarse para uso nacional, para exportación,
    o ambos';\n\tEND IF;\n\n\tIF p_table = 'facele.t_FECotizMonedas' THEN\n\t\tRETURN
    'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND
    IF;\n\n\tIF p_table = 'facele.t_FEDocTipos' THEN\n\t\tRETURN 'Si se indica la
    \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND IF;\n\n\tIF p_table
    = 'facele.t_FEIVATipos' THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe
    ser posterior a \"Fecha desde\"';\n\tEND IF;\n\n\tIF p_table = 'facele.t_FEOpcionalesTipos'
    THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha
    desde\"; el dato opcional debe usarse para uso nacional, para exportación, o ambos';\n\tEND
    IF;\n\n\tIF p_table = 'facele.t_FETributosTipos' THEN\n\t\tRETURN 'Si se indica
    la \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND IF;\n\n\tIF
    p_table = 'facele.t_FEComprobantes' THEN\n\t\tRETURN '(CbteHasta IS NULL OR (CbteHasta
    >= CbteDesde))\nAND (DocTipo = 99 OR DocNro IS NOT NULL)\nAND (FchVtoPago IS NULL
    OR FchVtoPago >= CbteFch)\nAND (Concepto = 1 OR FchServDesde IS NOT NULL)\nAND
    (Concepto = 1 OR FchServHasta IS NOT NULL)\nAND (Concepto = 1 OR FchServHasta
    >= FchServDesde)';\n\tEND IF;\n\n\t-- Busca sólo el nombre\n\n\tIF p_table ILIKE
    'Conceptos' THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe ser posterior
    a \"Fecha desde\"';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEXIdiomas' THEN\n\t\tRETURN
    'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND
    IF;\n\n\tIF p_table ILIKE 'FEXIncoterms' THEN\n\t\tRETURN 'Si se indica la \"Fecha
    hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND IF;\n\n\tIF p_table ILIKE
    'FEXTiposExpo' THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe ser posterior
    a \"Fecha desde\"';\n\tEND IF;\n\n\tIF p_table ILIKE 'FEXUnidadesMedida' THEN\n\t\tRETURN
    'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha desde\"';\n\tEND
    IF;\n\n\tIF p_table ILIKE 'Monedas' THEN\n\t\tRETURN 'Si se indica la \"Fecha
    hasta\", debe ser posterior a \"Fecha desde\"; la moneda debe usarse para uso
    nacional, para exportación, o ambos';\n\tEND IF;\n\n\tIF p_table ILIKE 'FECbteTipos'
    THEN\n\t\tRETURN 'Si se indica la \"Fecha hasta\", debe ser posterior a \"Fecha
    desde\"; el tipo de comprobante debe usarse para uso nacional, para exportación,
    o ambos';\n\tEND IF;\n\n\tIF p_table ILIKE 'FECotizMonedas' THEN\n\t\tRETURN 'Si
