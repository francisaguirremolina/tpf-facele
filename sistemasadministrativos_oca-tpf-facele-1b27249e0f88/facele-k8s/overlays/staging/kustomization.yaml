apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: facele-staging

resources:
  - ../../base

namePrefix: staging-

commonLabels:
  environment: staging
  app.kubernetes.io/instance: facele-staging

patches:
  - target:
      kind: Deployment
      name: facele-ws
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "750m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1500m"

  - target:
      kind: Service
      name: facele-ws-service
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

configMapGenerator:
  - name: staging-config
    literals:
      - DEBUG_LEVEL=0
      - LOG_LEVEL=INFO
      - WSAA_ENDPOINT=https://wsaahomo.afip.gov.ar/ws/services/LoginCms
      - WSFE_ENDPOINT=https://wswhomo.afip.gov.ar/wsfev1/service.asmx