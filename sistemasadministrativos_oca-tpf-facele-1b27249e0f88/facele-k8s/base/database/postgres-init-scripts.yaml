    Bienes Usados ? Emisor Monotributista este campo corresponde al importe subtotal.';\n\n\n--\n--
    Name: COLUMN t_fecomprobantes.impneto; Type: COMMENT; Schema: facele; Owner: sa\n--\n\nCOMMENT
