    NOT NULL,\n    descripcion facele.descripcion NOT NULL,\n    fchdesde facele.fecha
    NOT NULL,\n    fchhasta facele.fecha,\n    letrafiscal facele.letrafiscal,\n    sintetico
    facele.descripcion,\n    reporttemplate facele.reporttemplate,\n    cbtefam facele.cbtefam,\n
    \   usonacional facele.usonacional DEFAULT 1 NOT NULL,\n    usoexportac facele.usoexportac
    DEFAULT 0 NOT NULL,\n    CONSTRAINT t_fecbtetipos_check CHECK ((((fchhasta IS
    NULL) OR ((fchhasta)::date >= (fchdesde)::date)) AND (((usonacional)::integer
    = 1) OR ((usoexportac)::integer = 1))))\n);\n\n\nALTER TABLE facele.t_fecbtetipos
    OWNER TO sa;\n\n--\n-- Name: TABLE t_fecbtetipos; Type: COMMENT; Schema: facele;
    Owner: sa\n--\n\nCOMMENT ON TABLE facele.t_fecbtetipos IS 'CRDETR un tipo de comprobante,
