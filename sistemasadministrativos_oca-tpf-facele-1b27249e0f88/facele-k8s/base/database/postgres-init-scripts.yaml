    \   \n    \n\n\t\n\n-- Manejo de errores\nEXCEPTION\n\n\tWHEN  OTHERS THEN \n\n\t\tRAISE
    EXCEPTION '{%}', pg_parseException(SQLSTATE, SQLERRM, 'facele.t_Conceptos', 'eliminar',
    \n\t\t\t'Concepto = ' || l_Concepto::TEXT);\n\nEND;\n$$;\n\n\nALTER FUNCTION facele.spd_conceptos(p_concepto
