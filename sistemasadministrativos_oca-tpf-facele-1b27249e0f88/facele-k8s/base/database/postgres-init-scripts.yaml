    \   fecom.modelocopias,\n    fecom.estadopdf,\n    fecom.idlotefacturacion,\n
    \   fecom.codactividad,\n    fecom.codcondiva,\n    fecom.permisoexistente,\n
    \   fecom.idfexdstpais AS destinocmp,\n    fecom.idfexdstcuit AS cuitpaiscliente,\n
    \   fecom.canmismonext,\n    fecom.obscomerciales,\n    fecom.observaciones,\n
    \   fecom.formapago,\n    fecom.idfexidioma AS idiomacbte,\n    fecom.idfexincoterm
    AS incoterms,\n    fecom.incotermsdesc\n   FROM (facele.t_fecomprobantes fecom\n
    \    JOIN facele.t_feptosvta pv USING (idptovta));\n\n\nALTER VIEW facele.vw_comprobantesquery
