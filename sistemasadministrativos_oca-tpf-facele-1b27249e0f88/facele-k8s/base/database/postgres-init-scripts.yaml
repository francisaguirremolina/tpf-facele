    Name: spar_fecbtetipos(facele.t_fecbtetipos); Type: FUNCTION; Schema: facele;
    Owner: sa\n--\n\nCREATE FUNCTION facele.spar_fecbtetipos(p_rec facele.t_fecbtetipos)
