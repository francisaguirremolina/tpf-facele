    AS obj_name\n   FROM public.pg_object_usage\nUNION\n SELECT DISTINCT pg_object_usage.obj_type,\n
    \   pg_object_usage.obj_schema,\n    pg_object_usage.obj_name\n   FROM public.pg_object_usage;\n\n\nALTER
